name: crea

# Tests for the cREA additions under crea/. Upstream REA keeps its own CI.
on:
  push:
    branches: ["main", "crea/**"]
    paths: ["crea/**", ".github/workflows/crea.yml"]
  pull_request:
    paths: ["crea/**", ".github/workflows/crea.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crea-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: verify · web · manual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cached
      - name: Tests
        run: |
          export CREA_CHROMIUM="$(command -v google-chrome || command -v chromium || true)"
          node --test crea/verify.test.mjs crea/web/server.test.mjs crea/manual/manual.test.mjs

  music:
    name: music
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crea/music/requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: pip install -r crea/music/requirements.txt
      - run: python -I -m unittest discover -s crea/music -p 'test_*.py' -v
